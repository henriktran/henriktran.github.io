<style>
  :root {
    --color-background-primary: #000000;
    --color-text-primary: #fff;

    --color-text-tertiary: #888;
    --color-border-secondary: #ffffff;
    --border-radius-xl: 18px;
  }

  html,
  body {
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    min-height: 100vh;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    padding: 1rem;
    box-sizing: border-box;
    min-height: 100vh;
    width: 100%;
  }

  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: "DM Sans", sans-serif;

    .counter {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin-bottom: 1.5rem;
    }

    .card {
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-xl);
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
      box-shadow: 0 2px 24px 0 rgba(0, 0, 0, 0.25);

      &.fade-out {
        opacity: 0;
        transform: translateY(6px);
      }

      .card-text {
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        line-height: 1.55;
        font-weight: 400;
        color: var(--color-text-primary);
      }
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 1.75rem;

      button {
        opacity: 0;
        background: transparent;
        cursor: pointer;
        position: fixed;
        left: 0;
        top: 0;
        width: 50vw;
        height: 75vh;
        &.primary {
          left: auto;
          right: 0;
        }
        &#remove-btn {
          top: auto;
          bottom: 0;
          width: 100vw;
          height: 25vh;
          color: var(--color-text-secondary);
          border: none;
          opacity: 1;
        }
      }
    }
  }
</style>

<div class="card-wrap">
  <div class="counter" id="counter">1 / 20</div>

  <div class="card" id="card">
    <p class="card-text" id="q-text"></p>
  </div>

  <div class="nav">
    <button id="prev-btn" onclick="navigate(-1)">← back</button>
    <button class="primary" id="next-btn" onclick="navigate(1)">next →</button>
    <button id="remove-btn" onclick="removeCurrent()">
      Exclude this question
    </button>
  </div>
</div>

    "If we had to start completely over in a new city where no one knew us, who would we become?",
    "If we could have dinner with any three people — dead or alive — who would you pick for the best conversation?",
    "If you could give us one extra hour in every day just for us, what would you want to do with it?",

    // personality & self-discovery
    "What's a personality trait you have that you think I bring out more than anyone else?",
    "What's something you're better at than you give yourself credit for?",
    "What's a fear you had when we first got together that still lingers a little?",
    "What's something you did before you met me that you'd love to pick back up?",
    "Do you think you're the same person you were when we met — and if not, how have you changed?",

    "What's something you own that you'd never throw away, even if it's objectively useless?",

    "If you had to describe your love language using a specific scenario from our relationship, what would it be?",
    "What's something about the world that genuinely makes you hopeful?",
    "What's a hill you'd die on that has absolutely nothing to do with us — just a personal conviction?",

    "If you had to describe our first year together in one word, what would it be?",
    "What's the most important thing a relationship has ever taught you?",
  ];

  // Filter out removed questions
  let questions = allQuestions.filter((q) => !removedQuestions.includes(q));

  // Shuffle questions array using Fisher-Yates algorithm
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }
  questions = shuffle(questions);

  let current = 0;

  function render(animate) {
    const card = document.getElementById("card");
    const text = document.getElementById("q-text");
    const counter = document.getElementById("counter");
    const removeBtn = document.getElementById("remove-btn");

    if (questions.length === 0) {
      text.textContent = "No more questions!";
      counter.textContent = "0 / 0";
      removeBtn.disabled = true;
      return;
    } else {
      removeBtn.disabled = false;
    }

    if (animate) {
      card.classList.add("fade-out");
      setTimeout(() => {
        text.textContent = questions[current];
        counter.textContent = current + 1 + " / " + questions.length;
        card.classList.remove("fade-out");
      }, 220);
    } else {
      text.textContent = questions[current];
      counter.textContent = current + 1 + " / " + questions.length;
    }
  }

  function navigate(dir) {
    if (questions.length === 0) return;
    let next = current + dir;
    if (next < 0) {
      next = questions.length - 1;
    } else if (next >= questions.length) {
      next = 0;
    }
    current = next;
    render(true);
  }

  function removeCurrent() {
    if (questions.length === 0) return;
    const toRemove = questions[current];
    removedQuestions.push(toRemove);
    localStorage.setItem(REMOVED_KEY, JSON.stringify(removedQuestions));
    // Remove from questions array
    questions.splice(current, 1);
    if (current >= questions.length) {
      current = 0;
    }
    render(false);
  }

  render(false);
</script>
