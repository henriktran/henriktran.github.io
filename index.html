<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --color-background-primary: #000000;
    --color-text-primary: #fff;
    --color-text-secondary: #e8e8e8;
    --color-text-tertiary: #888;
    --color-border-secondary: #ffffff;
    --border-radius-base: 0.5rem;
    --font-size-base: 1rem;
  }

  html,
  body {
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    margin: 0;
    padding: 0;
  }
  * {
    box-sizing: border-box;
  }

  body {
    box-sizing: border-box;
  }

  .card-wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16vh 10vw;
    font-family: "DM Sans", sans-serif;

    .counter {
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin-bottom: 1rem;
    }

    .card {
      padding: 3rem 2.5rem;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
      box-shadow: inset 0px 0px 0px 1px white;
      position: relative;

      &::after,
      &::before {
        content: "";
        background: white;
        position: absolute;
      }
      &::after {
        width: 100%;
        height: 6px;
        left: 3px;
        bottom: 0;
        transform: translatey(100%) skewx(45deg);
      }
      &::before {
        width: 6px;
        height: 100%;
        right: 0;
        transform: translatex(100%) skewy(45deg);
        top: 3px;
      }

      &.fade-out {
        opacity: 0;
        transform: translateY(6px);
      }

      .card-text {
        font-family: "DM Sans", sans-serif;
        font-size: 14px;
        line-height: 1.55;
        font-weight: 600;
        color: var(--color-text-primary);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }
      .card-text.fade-out {
        opacity: 0;
        transform: translateY(6px);
      }
    }

    .nav {
      position: fixed;
      left: 0;
      bottom: 0;
      right: 0;
      top: 0;

      display: grid;
      grid-template-areas:
        "prev next"
        "remove remove";
      grid-template-rows: 1fr 10vh;

      button {
        opacity: 0;
        background: transparent;
        cursor: pointer;
        &#prev-btn {
          grid-area: prev;
        }
        &#next-btn {
          grid-area: next;
        }
        &#remove-btn {
          grid-area: remove;
          color: var(--color-text-tertiary);
          border: none;
          opacity: 1;
        }
      }
    }
  }
</style>

  <div class="card" id="card">
    <p class="card-text" id="q-text"></p>
  </div>

  <div class="nav">
    <button id="prev-btn" onclick="navigate(-1)">← back</button>
    <button id="next-btn" onclick="navigate(1)">next →</button>
    <button id="remove-btn" onclick="removeCurrent()">
      Exclude this question
    </button>
  </div>
</div>

  // Shuffle questions array using Fisher-Yates algorithm
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }
  questions = shuffle(questions);

  let current = 0;

  function render(animate) {
    const card = document.getElementById("card");
    const text = document.getElementById("q-text");
    const counter = document.getElementById("counter");
    const removeBtn = document.getElementById("remove-btn");

    if (questions.length === 0) {
      text.textContent = "No more questions!";
      counter.textContent = "0 / 0";
      removeBtn.disabled = true;
      return;
    } else {
      removeBtn.disabled = false;
    }

    if (animate) {
      text.classList.add("fade-out");
      setTimeout(() => {
        text.textContent = questions[current];
        counter.textContent = current + 1 + " / " + questions.length;
        text.classList.remove("fade-out");
      }, 220);
    } else {
      text.textContent = questions[current];
      counter.textContent = current + 1 + " / " + questions.length;
    }
  }

  function navigate(dir) {
    if (questions.length === 0) return;
    let next = current + dir;
    if (next < 0) {
      next = questions.length - 1;
    } else if (next >= questions.length) {
      next = 0;
    }
    current = next;
    render(true);
  }

  function removeCurrent() {
    if (questions.length === 0) return;
    const toRemove = questions[current];
    removedQuestions.push(toRemove);
    localStorage.setItem(REMOVED_KEY, JSON.stringify(removedQuestions));
    // Remove from questions array
    questions.splice(current, 1);
    if (current >= questions.length) {
      current = 0;
    }
    render(false);
  }

  render(false);
